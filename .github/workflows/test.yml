name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev libsndfile1
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: cl-asr
      - uses: 40ants/run-tests@v2
        with:
          asdf-system: cl-asr
